[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

# Markers
markers =
    unit: pure unit tests (no DB, no network) — fast
    integration: tests that touch a temporary SQLite DB — medium speed
    regression: schema/contract tests guarding against silent breakages — medium speed
    slow: tests > 1s — opt-in only

# Treat warnings as errors except known noisy ones from deps
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:google.*
    ignore::PendingDeprecationWarning
