name: Export Public Metrics (clean)

# Phase 1 of the Idealista decoupling: this workflow runs the CLEAN
# exporter (export_clean_metrics.py) which only reads non-scraping data
# sources (Notariado CIEN, BCE, INE, CGPJ, Open Data Madrid).  It is
# fully decoupled from `daily_scraper.yml` — they share the SQLite DB
# only because the clean exporter still needs to read `notarial_prices`
# and `cgpj_lanzamientos`, both of which are populated by independent
# importers, not by the Idealista scraper.

on:
  schedule:
    # Weekly, Mondays 07:00 UTC (09:00 Madrid summer / 08:00 winter).
    # Clean sources update at most monthly (Notariado quarterly, INE
    # monthly, CGPJ quarterly), so weekly is plenty.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Manual trigger from the Actions tab.

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The clean exporter reads notarial_prices + cgpj_lanzamientos
      # from the same SQLite DB the scraper writes to. Both are
      # populated by independent importers (Notariado CSV / CGPJ portal).
      - name: Download database from Google Drive
        env:
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: |
          python - <<'EOF'
          import os, gdown, pathlib
          file_id = os.environ["GOOGLE_DRIVE_FILE_ID"]
          gdown.download(f"https://drive.google.com/uc?id={file_id}", "real_estate.db", quiet=False)
          size_mb = pathlib.Path("real_estate.db").stat().st_size / 1024 / 1024
          print(f"Downloaded: {size_mb:.1f} MB")
          EOF

      # The --verify flag fails the run if any "tóxico" key leaks into
      # the output. This is the safety net: a regression in the
      # exporter that tries to read listings will fail loudly here
      # rather than silently shipping scraped data to the public CDN.
      - name: Build clean public metrics
        run: python export_clean_metrics.py --verify -o metrics.json

      # Clone market-thermometer up-front so the barrio-profiles
      # exporter can read the in-tree district_opendata.json (the
      # canonical Open Data Madrid mirror lives under public/ on the
      # front, not in this repo).
      - name: Clone market-thermometer (read + write)
        env:
          THERMOMETER_PAT: ${{ secrets.THERMOMETER_PAT }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${THERMOMETER_PAT}@github.com/softniric-cyber/market-thermometer.git \
            _thermometer

      # Phase 2.2: build the populated barrios_profiles.json from clean
      # sources (Notarial CIEN distrito €/m² + Open Data Madrid renta
      # media hogar per barrio). The exporter has its own --verify
      # safety net that fails the run on banned listing-derived keys
      # or collapsed verdict variety.
      - name: Build clean barrios_profiles.json
        run: |
          python export_barrio_profiles_clean.py \
            --verify \
            --opendata _thermometer/public/district_opendata.json \
            -o barrios_profiles.json

      - name: Publish to market-thermometer
        run: |
          cp metrics.json          _thermometer/public/metrics.json
          cp barrios_profiles.json _thermometer/public/barrios_profiles.json

          cd _thermometer
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add public/metrics.json public/barrios_profiles.json
          git diff --staged --quiet || {
            git commit -m "Update clean metrics $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          }

      - name: Summary
        run: |
          echo "::notice::metrics.json size: $(stat -c%s metrics.json) bytes"
          echo "::notice::barrios_profiles.json size: $(stat -c%s barrios_profiles.json) bytes"
