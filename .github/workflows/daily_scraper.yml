name: Daily Scraper

# ──────────────────────────────────────────────────────────────────────────
# Postgres backend (Phase D cutover, May 2026).
#
# Reads/writes go through ``DB_BACKEND=postgres`` against the Supabase
# Postgres pointed at by the ``DATABASE_URL`` secret. The Google Drive
# sync (download at start / upload at end) is gone: the DB lives in one
# place and every consumer (scraper, exporters, Streamlit) talks to it
# directly.
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 2 days at 06:00 UTC (08:00 Madrid CEST).
    # Re-enabled on 2026-05-31 after the Oxylabs migration (PR #61).
    # Cadence preserved verbatim from the pre-pause config.
    - cron: "0 6 */2 * *"
  workflow_dispatch:
    # Manual trigger from the Actions tab — handy for catch-up runs and
    # for validating new providers before letting the cron pick them up.

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360         # ~3h venta + alquiler semanal; GitHub max = 360

    # Backend selection is job-wide: every step that ends up calling
    # ``db.connection.get_db()`` (scraper, snapshots, email, summary)
    # picks Postgres via the dispatching shim.  ``DATABASE_URL`` is the
    # standard libpq env var; ``db.connection_pg._resolve_url`` reads it.
    env:
      DB_BACKEND: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencias ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: the "download DB from Google Drive" and
      # "backfill price_history" steps that lived here pre-cutover are
      # gone.  The DB is in Postgres now; new rows go straight in,
      # existing rows were one-shot-loaded by migration_sqlite_to_postgres.py.

      # ── 4. Scraping ──────────────────────────────────────────────────────────
      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          # Primary paid tier as of PR #61.  When set, scraper.py routes
          # every fetch through Oxylabs Web Scraper API first and only
          # falls back to BrightData when all retries are exhausted.
          OXYLABS_USER: ${{ secrets.OXYLABS_USER }}
          OXYLABS_PASS: ${{ secrets.OXYLABS_PASS }}
          # BrightData kept wired as fallback. Recharge the account if
          # the Oxylabs tier ever struggles in production — the fallback
          # path only activates when both credentials AND balance are good.
          BRIGHTDATA_USER: ${{ secrets.BRIGHTDATA_USER }}
          BRIGHTDATA_PASS: ${{ secrets.BRIGHTDATA_PASS }}
          BRIGHTDATA_HOST: ${{ secrets.BRIGHTDATA_HOST }}
          BRIGHTDATA_RESIDENTIAL_HOST: ${{ secrets.BRIGHTDATA_RESIDENTIAL_HOST }}
          BRIGHTDATA_RESIDENTIAL_USER: ${{ secrets.BRIGHTDATA_RESIDENTIAL_USER }}
          BRIGHTDATA_RESIDENTIAL_PASS: ${{ secrets.BRIGHTDATA_RESIDENTIAL_PASS }}
          # Billing API token: enables real month-to-date cost in the email.
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper.py
        continue-on-error: true    # Partial scrapes still provide valuable data

      # ── 4b. Pre-compute daily market snapshots ─────────────────────────────
      - name: Compute daily snapshots
        run: python compute_snapshots.py
        continue-on-error: true

      # ── 5. Email diario (opcional) ───────────────────────────────────────────
      - name: Send daily email report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_report.py
        continue-on-error: true    # No bloquear el pipeline si el email falla

      # NOTE: the public-metrics export step that used to live here was
      # removed as part of Phase 1 of the Idealista decoupling.  The
      # public dashboard at madridhome.tech is now refreshed by the
      # separate `export-metrics.yml` workflow, which uses a CLEAN
      # exporter that never reads listings/price_history.  This scraper
      # keeps writing to the private DB (Streamlit dashboard) without
      # ever pushing scraper-derived data to the public site.

      # ── 6. Resumen ────────────────────────────────────────────────────────────
      - name: Scrape summary
        run: |
          python - <<'EOF'
          from database import get_database_stats
          s = get_database_stats()
          print(f"✅ Active listings:  {s['active_count']:,}")
          print(f"   Sold/removed:     {s['sold_count']:,}")
          print(f"   Avg price:        €{s['avg_price']:,.0f}")
          EOF

      # ── 7. Health-check (fail loudly when nothing useful happened) ────────
      # The previous steps run with ``continue-on-error: true`` so a failed
      # scrape doesn't take the whole workflow with it (we still want the
      # email + snapshots steps to run on partial data).  That gentleness
      # also means a *fully* broken scraper run can finish "green" — the
      # post-mortem from this session showed 2.5 months of silent failures
      # for exactly that reason.  This guard explicitly fails the run when
      # the latest ``scraping_log`` row is stale or trivially small.
      #
      # No ``continue-on-error`` here on purpose: a red workflow run is
      # exactly the signal we want when the data pipeline stops producing.
      - name: Verify scrape actually produced data
        run: |
          python - <<'EOF'
          import sys
          from datetime import date, timedelta
          from database import get_scraping_log

          MIN_PROPERTIES   = 1000   # below this, the scraper effectively did nothing
          MAX_STALENESS_D  = 2      # latest log row must be no older than this

          log = get_scraping_log(limit=1)
          if not log:
              sys.exit("❌ No scraping_log rows found at all — scraper never wrote.")

          row = log[0]
          n = int(row.get("properties_processed") or 0)
          if n < MIN_PROPERTIES:
              sys.exit(
                  f"❌ Last run only processed {n} properties "
                  f"(threshold {MIN_PROPERTIES}).  Treat as silent failure."
              )

          # ``start_time`` is text on SQLite, datetime on Postgres.
          ts = row.get("start_time")
          if hasattr(ts, "date"):
              ran = ts.date() if hasattr(ts, "hour") else ts
          else:
              ran = date.fromisoformat(str(ts)[:10])
          age = (date.today() - ran).days
          if age > MAX_STALENESS_D:
              sys.exit(
                  f"❌ Latest scraping_log entry is {age} days old ({ran}) "
                  f"— newer run never reached log_scraping_execution()."
              )

          print(f"✅ Verified: {n:,} properties · last ran {ran} ({age}d ago).")

          # NOTE: the rental-freshness sub-check was removed on 2026-06-03
          # when rental scraping was disabled (RENTAL_SCRAPE_ENABLED=false).
          # rental_prices is intentionally frozen now, so a staleness guard
          # would fail every run. Re-add it if rental scraping is resumed.
          EOF
