name: Daily Scraper

# ──────────────────────────────────────────────────────────────────────────
# Postgres backend (Phase D cutover, May 2026).
#
# This workflow now reads/writes through ``DB_BACKEND=postgres`` against
# the Supabase Postgres pointed at by the ``DATABASE_URL`` secret. The
# Google Drive sync (download at start / upload at end) is gone: the DB
# lives in one place and every consumer (scraper, exporters, Streamlit)
# talks to it directly.
#
# Cron is intentionally still commented out.  Re-enable it manually
# **only after**:
#   1. ``alembic upgrade head`` has been applied to the target Postgres
#      (one-shot, sets up the schema in ``alembic/versions/0001…``).
#   2. ``python migration_sqlite_to_postgres.py`` has loaded the SQLite
#      snapshot into it (one-shot Phase C backfill).
#   3. A local Streamlit smoke against the same DATABASE_URL renders
#      the dashboard with sensible numbers.
#
# Until then, ``workflow_dispatch`` lets us trigger ad-hoc runs from
# the Actions tab for verification.
# ──────────────────────────────────────────────────────────────────────────

on:
  # schedule:
  #   # Runs every 3 days (Mon/Thu) at 06:00 UTC (08:00 Madrid CEST)
  #   - cron: "0 6 * * 1,4"
  workflow_dispatch:
    # Manual trigger from the Actions tab.

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360         # ~3h venta + alquiler semanal; GitHub max = 360

    # Backend selection is job-wide: every step that ends up calling
    # ``db.connection.get_db()`` (scraper, snapshots, email, summary)
    # picks Postgres via the dispatching shim.  ``DATABASE_URL`` is the
    # standard libpq env var; ``db.connection_pg._resolve_url`` reads it.
    env:
      DB_BACKEND: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencias ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: the "download DB from Google Drive" and
      # "backfill price_history" steps that lived here pre-cutover are
      # gone.  The DB is in Postgres now; new rows go straight in,
      # existing rows were one-shot-loaded by migration_sqlite_to_postgres.py.

      # ── 4. Scraping ──────────────────────────────────────────────────────────
      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          BRIGHTDATA_USER: ${{ secrets.BRIGHTDATA_USER }}
          BRIGHTDATA_PASS: ${{ secrets.BRIGHTDATA_PASS }}
          BRIGHTDATA_HOST: ${{ secrets.BRIGHTDATA_HOST }}
          BRIGHTDATA_RESIDENTIAL_HOST: ${{ secrets.BRIGHTDATA_RESIDENTIAL_HOST }}
          BRIGHTDATA_RESIDENTIAL_USER: ${{ secrets.BRIGHTDATA_RESIDENTIAL_USER }}
          BRIGHTDATA_RESIDENTIAL_PASS: ${{ secrets.BRIGHTDATA_RESIDENTIAL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper.py
        continue-on-error: true    # Partial scrapes still provide valuable data

      # ── 4b. Pre-compute daily market snapshots ─────────────────────────────
      - name: Compute daily snapshots
        run: python compute_snapshots.py
        continue-on-error: true

      # ── 5. Email diario (opcional) ───────────────────────────────────────────
      - name: Send daily email report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_report.py
        continue-on-error: true    # No bloquear el pipeline si el email falla

      # NOTE: the public-metrics export step that used to live here was
      # removed as part of Phase 1 of the Idealista decoupling.  The
      # public dashboard at madridhome.tech is now refreshed by the
      # separate `export-metrics.yml` workflow, which uses a CLEAN
      # exporter that never reads listings/price_history.  This scraper
      # keeps writing to the private DB (Streamlit dashboard) without
      # ever pushing scraper-derived data to the public site.

      # ── 6. Resumen ────────────────────────────────────────────────────────────
      - name: Scrape summary
        run: |
          python - <<'EOF'
          from database import get_database_stats
          s = get_database_stats()
          print(f"✅ Active listings:  {s['active_count']:,}")
          print(f"   Sold/removed:     {s['sold_count']:,}")
          print(f"   Avg price:        €{s['avg_price']:,.0f}")
          EOF
